name: Final verify and clean v21.6 staging

on:
  push:
    branches:
      - v21.6-category-games
    paths:
      - .github/workflows/build-v216.yml

permissions:
  contents: write

jobs:
  finalise-v216:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: v21.6-category-games
          fetch-depth: 0

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          node --check element-sets.js
          node --check app.js
          node --test tests/*.test.js
          node -e "JSON.parse(require('node:fs').readFileSync('elementSets.seed.json','utf8')); JSON.parse(require('node:fs').readFileSync('database.rules.v21.6.json','utf8')); console.log('JSON OK')"
          echo "dcf71644537615260acc37d59f3239f9bb151dc4c5ce2fc5a8fa1415c2d9e077  app.js" | sha256sum -c -
          echo "78ed127d01f995c8216ab25a9fc0f10daceff9ad9fdec19b956c8b6a50798be7  styles.css" | sha256sum -c -
          echo "14eb56e70552fbefa0bcd0b777bc18fdccc1cc0c10276b492640e0e6fe31caac  database.rules.v21.6.json" | sha256sum -c -

      - name: Remove temporary build staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r scripts/v216 .github/workflows/build-v216.yml
          git commit -m "chore: remove v21.6 build staging"
          git push origin HEAD:v21.6-category-games
