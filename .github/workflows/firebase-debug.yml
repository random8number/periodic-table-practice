name: Firebase rules debug

on:
  push:
    branches:
      - v21.6.1-firebase-debug
    paths:
      - tests/**
      - app.js
      - element-sets.js
      - index.html
      - database.rules.v21.6.json
      - elementSets.seed.json
      - answers.seed.json
      - .github/workflows/firebase-debug.yml

permissions:
  contents: write

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run v21.6 unit and contract tests
        shell: bash
        run: |
          node tests/element-sets.test.js
          node tests/ui-contract.test.js
          node tests/rules-v21.6.test.js
      - name: Install Firebase emulator test dependencies
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Configure Realtime Database emulator
        run: |
          cat > firebase.json <<'JSON'
          {
            "database": { "rules": "database.rules.v21.6.json" },
            "emulators": { "database": { "port": 9000 }, "ui": { "enabled": false } }
          }
          JSON
      - name: Run Firebase room-creation verification and capture result
        id: reproduce
        shell: bash
        run: |
          set +e
          {
            echo "=== v21.6 local tests ==="
            node tests/element-sets.test.js
            node tests/ui-contract.test.js
            node tests/rules-v21.6.test.js
            echo ""
            echo "=== Firebase emulator test ==="
            npx firebase emulators:exec --only database --project demo-periodic-table "node --test tests/firebase-room-create-emulator.test.mjs"
          } > firebase-debug-result.txt 2>&1
          rc=$?
          echo "" >> firebase-debug-result.txt
          echo "EXIT_CODE=$rc" >> firebase-debug-result.txt
          cat firebase-debug-result.txt
          exit $rc
      - name: Commit diagnostic result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-debug-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: capture final v21.6 verification"
            git push origin HEAD:v21.6.1-firebase-debug
          fi
